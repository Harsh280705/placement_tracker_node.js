# Placement Tracker (Node.js) — NGINX reverse proxy + static host (SINGLE container).
#
# Single public entry point:  http://localhost:8080
#   /        -> Vue production bundle (static files in /usr/share/nginx/html,
#               built from the same frontend sources; try_files keeps
#               vue-router history-mode routes working)
#   /api/... -> Node.js/Express API on 127.0.0.1:3000 (URI forwarded unchanged)

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Node.js/Express API --------------------------------------------------
    # URI is forwarded unchanged: /api/applications -> /api/applications.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Vue 3 frontend (static bundle + SPA fallback) ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
